<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
  </defs>
  <!-- full-bleed square, no baked-in corner radius: let each OS apply its
       own icon mask so there's no gap for a light wallpaper to show through -->
  <rect width="512" height="512" fill="#0a0a0c"/>
  <!-- lightning bolt, kept within the maskable safe zone -->
  <path d="M300 96 L150 288 h86 l-40 128 190 -208 h-96 z" fill="url(#g)"/>
</svg>
